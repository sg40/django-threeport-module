# A Django instance deployed from an existing definition.
#
#   tptctl django create django-instance -c samples/django-instance.yaml
DjangoInstance:
  Name: myapp-dev
  DjangoDefinition:
    Name: myapp
  # omit KubernetesRuntimeInstance to deploy to the control plane's default
  # runtime, which is what a single-cluster install wants
  KubernetesRuntimeInstance:
    Name: threeport-dev-0
