# A Django instance deployed from an existing definition.
#
#   tptctl django create django-instance -c samples/django-instance.yaml
DjangoInstance:
  Name: myapp-dev
  DjangoDefinition:
    Name: myapp
  # KubernetesRuntimeInstance is optional. Left out, as it is here, the instance
  # goes to the control plane's default runtime, which is what a single-cluster
  # install wants. Name one to deploy somewhere else:
  #
  #   KubernetesRuntimeInstance:
  #     Name: my-runtime
